# M4 — Full proposed model: Shallow GNN + Transformer + Positional Encoding
model:
  type: hybrid
  in_dim: 15
  hidden_dim: 64
  gnn_layers: 2
  transformer_layers: 2
  heads: 4
  pe_dim: 32
  num_freqs: 8
  gnn_dropout: 0.3
  transformer_dropout: 0.1
  use_pe: true

superpixels:
  n_segments: 300
  compactness: 10.0
  sigma: 1.0

graph:
  k: 8
  sigma: 0.1

labels:
  threshold: 0.3

data:
  graph_dir: data/graphs/train
  train_ratio: 0.7
  val_ratio: 0.15

training:
  epochs: 150
  lr: 0.001
  weight_decay: 0.0005
  warmup_epochs: 5
  grad_clip_norm: 1.0
  batch_size: 1
  early_stopping_patience: 20
  seed: 42

output_dir: results/M4_hybrid_full
