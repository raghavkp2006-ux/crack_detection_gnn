data:
  graph_dir: data/graphs/train
  train_ratio: 0.7
  val_ratio: 0.15
graph:
  k: 8
  sigma: 0.1
labels:
  threshold: 0.3
model:
  dropout: 0.3
  hidden_dim: 64
  in_dim: 15
  num_layers: 2
  type: shallow_gnn
  use_residual: true
output_dir: results/step2_loss/M2_shallow_gnn
superpixels:
  compactness: 10.0
  n_segments: 300
  sigma: 1.0
training:
  batch_size: 1
  early_stopping_patience: 20
  epochs: 150
  focal_gamma: 2.0
  loss: focal
  lr: 0.001
  seed: 42
  weight_decay: 0.0005
